  base_url: https://omoapicall.web.id/v1
  key_env: HERMES_CUSTOM_OMOAPICALL_WEB_ID_API_KEY
  model: step-5-preview
  models:
    step-5-preview: {}
    step-3.7-flash: {}
    deepseek-v4.1-UNSENSORED: {}
    glm-5.3-flash: {}
