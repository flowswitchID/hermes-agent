prefill_messages_file: /root/.hermes/prefill_hackmode.json
approvals:
  mode: 'off'
  cron_mode: 'off'
  single_query_mode: 'off'
  unattended_mode: 'off'
  denial_breaker_threshold: 0
  mcp_reload_confirm: false
  destructive_slash_confirm: false
security:
  redact_secrets: false
  allow_private_urls: true
  protected_instruction_files: false
  website_blocklist:
    enabled: false
  allow_data_training_tiers_noninteractive: true
privacy:
  redact_pii: false
mcp_servers:
  rea:
    command: /tmp/node-v24.22.1-linux-x64/bin/node
    args:
    - /root/rea/scripts/rea.mjs
    - mcp
    enabled: true
